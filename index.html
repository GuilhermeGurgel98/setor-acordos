<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Setor de Acordos D'Freire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,650&display=swap" rel="stylesheet">
<style>
/* Plano: ferramenta de trabalho do setor. Barra lateral de navegação, área principal em grade de cartões e tabelas.
   Tinta grafite com dourado D'Freire como acento; cores semânticas só para estado (prazo, alçada, atraso). */
:root{
  --bg:#f5f4f1; --surface:#ffffff; --ink:#1d1f24; --muted:#6b6e76; --line:#e2e0da;
  --accent:#a8842c; --accent-ink:#ffffff; --accent-soft:#f3ecd9;
  --ok:#2f7d4f; --ok-soft:#e3f1e8; --warn:#a46a10; --warn-soft:#fbefd9; --bad:#b23a32; --bad-soft:#f8e2df; --info:#2f5f8f; --info-soft:#e2ecf6;
  --f-display:"Source Serif 4", Georgia, "Times New Roman", serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --r:8px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15161a; --surface:#1e2026; --ink:#eceae4; --muted:#9a9ca4; --line:#30323a;
    --accent:#d2ad55; --accent-ink:#17181b; --accent-soft:#3a3222;
    --ok:#6cc08d; --ok-soft:#1f3328; --warn:#e2a54a; --warn-soft:#3a2d17; --bad:#ef7d74; --bad-soft:#3d2120; --info:#7fb0e0; --info-soft:#1d2b3a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15161a; --surface:#1e2026; --ink:#eceae4; --muted:#9a9ca4; --line:#30323a;
  --accent:#d2ad55; --accent-ink:#17181b; --accent-soft:#3a3222;
  --ok:#6cc08d; --ok-soft:#1f3328; --warn:#e2a54a; --warn-soft:#3a2d17; --bad:#ef7d74; --bad-soft:#3d2120; --info:#7fb0e0; --info-soft:#1d2b3a;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);font-weight:650;text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:1.6rem} h2{font-size:1.25rem} h3{font-size:1.02rem}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

.app{display:grid;grid-template-columns:230px 1fr;min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;flex-direction:column;gap:2px;padding:0 6px}
.brand b{font-family:var(--f-display);font-size:1.15rem}
.brand span{color:var(--muted);font-size:.82rem}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:6px;text-decoration:none;color:var(--ink)}
.nav a:hover{background:var(--bg)}
.nav a.on{background:var(--accent-soft);font-weight:600}
.nav .ni{display:flex;align-items:center;gap:10px}
.nav svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;opacity:.75}
.nav a.on svg{opacity:1;stroke:var(--accent)}
.nav .badge.soft{background:var(--accent-soft);color:var(--ink)}
.nav .badge{background:var(--bad);color:#fff;border-radius:10px;font-size:.72rem;padding:0 7px;font-weight:600}
.nav .sep{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:12px 10px 4px}
.who{margin-top:auto;border-top:1px solid var(--line);padding:12px 6px 0;font-size:.85rem;display:flex;flex-direction:column;gap:6px}
.who select{width:100%}

main{padding:24px clamp(16px,3vw,36px) 60px;min-width:0;display:flex;flex-direction:column;gap:20px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.top p{margin:4px 0 0;color:var(--muted);max-width:65ch}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.tiles{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.tile .k{font-size:.78rem;color:var(--muted)}
.tile .v{font-size:1.45rem;font-weight:600;margin-top:2px}
.tile .s{font-size:.78rem;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card > header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.muted{color:var(--muted)} .small{font-size:.84rem}
.empty{color:var(--muted);font-size:.9rem;padding:10px 0}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.p{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.s{padding:3px 8px;font-size:.82rem}
.btn.d{color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}

.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:.76rem;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.info{background:var(--info-soft);color:var(--info)}
.pill.n{background:var(--bg);color:var(--muted);border:1px solid var(--line)}

.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th{text-align:left;font-weight:600;color:var(--muted);font-size:.78rem;border-bottom:1px solid var(--line);padding:6px 8px;white-space:nowrap}
td{border-bottom:1px solid var(--line);padding:7px 8px;vertical-align:top}
td b{white-space:nowrap}td .row span{white-space:nowrap}
td.n,th.n{text-align:right}
tr.click{cursor:pointer} tr.click:hover td{background:var(--bg)}

.list{display:flex;flex-direction:column}
.item{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .b{flex:1;min-width:0}
.item .t{font-weight:500}
.stripe{width:4px;align-self:stretch;border-radius:2px;background:var(--line)}
.stripe.bad{background:var(--bad)} .stripe.warn{background:var(--warn)} .stripe.ok{background:var(--ok)} .stripe.info{background:var(--info)}

.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:10px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:8px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.col h3{font-family:var(--f-body);font-size:.84rem;font-weight:600;display:flex;justify-content:space-between;padding:2px 4px}
.kc{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:6px;padding:8px 10px;display:flex;flex-direction:column;gap:4px;cursor:pointer;font-size:.86rem}
.kc:hover{border-color:var(--accent)}
.kc.late{border-left-color:var(--bad)} .kc.mid{border-left-color:var(--warn)} .kc.fresh{border-left-color:var(--ok)}
.kc .t{font-weight:600}
.kc .mv{display:flex;justify-content:space-between;gap:4px;margin-top:4px}

.bar{height:8px;background:var(--bg);border-radius:4px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--accent)}
.bar.ok i{background:var(--ok)}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{border:0;background:none;padding:8px 12px;border-bottom:2px solid transparent;cursor:pointer;color:var(--muted)}
.tabs button.on{border-color:var(--accent);color:var(--ink);font-weight:600}

.note{border:1px solid var(--line);border-left:4px solid var(--accent);background:var(--surface);border-radius:6px;padding:12px 14px;font-size:.9rem}
.note.bad{border-left-color:var(--bad)} .note.ok{border-left-color:var(--ok)}
.note ul{margin:6px 0 0;padding-left:18px}

.ovl{position:fixed;inset:0;background:rgba(10,10,12,.45);display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;z-index:50;overflow:auto}
.modal{background:var(--surface);border-radius:10px;border:1px solid var(--line);width:min(720px,100%);padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.modal header{display:flex;justify-content:space-between;align-items:center}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 14px}
.form .full{grid-column:1/-1}
.form label{display:flex;flex-direction:column;gap:3px;font-size:.8rem;color:var(--muted)}
.form label.ck{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:.88rem}
.form input:not([type=checkbox]),.form select,.form textarea{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:7px 9px;width:100%;color:var(--ink);font-size:.92rem}
.form textarea{min-height:64px;resize:vertical}
.form .sec{grid-column:1/-1;font-weight:600;font-size:.82rem;border-top:1px solid var(--line);padding-top:10px;color:var(--ink)}
.calc{background:var(--bg);border-radius:6px;padding:10px 12px;font-size:.88rem;grid-column:1/-1}
.modal.wide{width:min(1180px,100%)}
.ficha{display:grid;grid-template-columns:1.25fr 1fr;gap:18px}
.fcol{display:flex;flex-direction:column;gap:14px;min-width:0}
.guia{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.guia .ck{display:flex;gap:8px;align-items:flex-start;font-size:.88rem}
.qlist{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.q{display:flex;flex-direction:column;gap:3px;font-size:.88rem}
.q input{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 9px;color:var(--ink)}
.analise{font-size:.9rem;max-height:52vh;overflow:auto}
.analise h3{font-family:var(--f-body);font-size:.9rem;margin:12px 0 4px;color:var(--accent)}
.analise p{margin:4px 0}.analise ul{margin:4px 0;padding-left:18px}
.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.fc{all:unset;box-sizing:border-box;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:6px;cursor:pointer}
.fc:hover{border-color:var(--accent)}.fc:focus-visible{outline:2px solid var(--accent)}
.clip{color:var(--ink);opacity:.85;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty-big{text-align:center;padding:40px 10px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:10px;background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}
.card .empty-big{border:0;padding:24px}
.btn.wa{border-color:#25a35a;color:#1f8a4c}
a.btn{text-decoration:none;display:inline-block}
@media (max-width:900px){.ficha{grid-template-columns:1fr}}
.tl{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tl>div{background:var(--bg);border-radius:6px;padding:8px 10px;display:flex;flex-direction:column}
.tl .k{font-size:.74rem;color:var(--muted)}.tl .s{font-size:.76rem;color:var(--muted)}
.upd{display:flex;flex-direction:column;gap:6px;margin:6px 0 4px}
.upd textarea{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:8px;min-height:60px;color:var(--ink);resize:vertical}
.upd .btn{align-self:flex-end}
.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.mini div{background:var(--bg);border-radius:6px;padding:6px 2px;display:flex;flex-direction:column}
.mini b{font-size:1.2rem}.mini span{font-size:.7rem;color:var(--muted)}
.pc .small>div{padding:2px 0}
.pre{white-space:pre-wrap;font:inherit;font-size:.88rem;background:var(--bg);border-radius:6px;padding:12px;margin:0}
.nichos{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(380px,1fr))}
.nicho .fato{background:var(--accent-soft);border-radius:6px;padding:10px 12px;font-size:.9rem}.nicho .fato p{margin:4px 0 0}
.passos{margin:4px 0 0;padding-left:20px;font-size:.88rem;display:flex;flex-direction:column;gap:3px}
.nicho ul{margin:4px 0 0;padding-left:18px}.fontes a{color:var(--muted)}
@media (max-width:480px){.nichos{grid-template-columns:1fr}}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:6px;z-index:60;font-size:.9rem}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters select,.filters input{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 8px}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:6px;padding:8px 12px;font-size:.88rem}
svg text{fill:var(--muted);font-size:10px;font-family:var(--f-body)}

@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:column}
  .nav{flex-direction:row;flex-wrap:wrap}
  .nav .sep{display:none}
}

/* tela de entrada (login próprio, fora do Claude) */
.auth{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.auth .box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:12px}
.auth h1{font-family:var(--f-display);font-size:1.5rem;margin:0}
.auth p{margin:0;color:var(--muted);font-size:.9rem}
.auth label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted)}
.auth input{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.auth .msg{font-size:.85rem;min-height:1.2em}
.auth .msg.err{color:var(--bad)} .auth .msg.ok{color:var(--ok)}
.auth a{color:var(--accent);font-size:.85rem;cursor:pointer;text-decoration:underline}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><b>Setor de Acordos</b><span>D'Freire · acordos de clientes com outras partes</span></div>
    <nav class="nav" id="nav"></nav>
    <div class="who" id="who"></div>
  </aside>
  <main id="main"><p class="muted">Carregando dados do setor…</p></main>
</div>
<div id="layer"></div>
<div id="auth"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
/* ===================== utilidades ===================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const brlK=v=>{v=+v||0;return v>=1e6?'R$ '+(v/1e6).toLocaleString('pt-BR',{maximumFractionDigits:1})+' mi':v>=1e4?'R$ '+(v/1e3).toLocaleString('pt-BR',{maximumFractionDigits:0})+' mil':brl(v)};
const pct=v=>isFinite(v)?(v*100).toLocaleString('pt-BR',{maximumFractionDigits:0})+'%':'–';
const iso=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const hoje=()=>iso(Date.now());
const fd=s=>{if(!s)return '–';const [y,m,d]=String(s).slice(0,10).split('-');return d+'/'+m+'/'+y.slice(2)};
const dias=(a,b)=>Math.round((new Date(String(b).slice(0,10))-new Date(String(a).slice(0,10)))/864e5);
const addDias=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return iso(d)};
const nid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function toast(m){document.querySelectorAll('.toast').forEach(x=>x.remove());const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}

/* ===================== domínio ===================== */
const ETAPAS=[
  ['mapeado','Mapeado'],['proposta','Proposta pronta'],['autorizado','Cliente autorizou'],['negociacao','Em negociação'],
  ['aceito','Aceito'],['termo','Termo assinado'],['homologado','Homologado'],['cumprimento','Em cumprimento'],['cumprido','Cumprido']];
const ETAPA_IDX=Object.fromEntries(ETAPAS.map((e,i)=>[e[0],i]));
const FECHADO_MIN=ETAPA_IDX.aceito;
const CONTRAPARTES=['Banco','Fazenda Pública','INSS / União','Empresa','Empregador','Pessoa física','Seguradora','Construtora'];
const CANAIS=['WhatsApp','Telefone','Presencial','E-mail','Audiência'];
const INTERLOCUTOR=['Cliente','Contraparte','Advogado da contraparte','Preposto','Procuradoria'];
const RESULTADOS=['Sem resposta','Recado deixado','Conversa sem avanço','Proposta enviada','Contraproposta recebida','Acordo aceito','Proposta recusada','Cliente orientado','Autorização do cliente obtida','Documentos solicitados'];
const NAO_EFETIVO=['Sem resposta','Recado deixado'];
const PAPEIS=[['integrante','Integrante'],['coordenador','Coordenador'],['diretoria','Diretoria']];
const RANK={integrante:1,coordenador:2,diretoria:3};
const FRENTES=['Acordos em processos','Atendimento a clientes','Triagem e captação','Controle de cumprimento'];
const POPS={
  'POP-01':['Registro de contato',['Cliente ou processo identificado','Canal e interlocutor anotados','Resumo em uma linha','Próximo passo com data']],
  'POP-02':['Negociação de acordo',['Valor de referência informado pelo advogado do processo','Escada de propostas definida (1ª, 2ª, 3ª)','Faixa de alçada conferida','Procuração com poderes para transigir e dar quitação','Autorização escrita do cliente salva','Contato com a contraparte pelo roteiro do tipo dela','Termo minutado com honorários de sucumbência tratados','Petição de homologação protocolada']],
  'POP-03':['Audiência de conciliação',['Pauta da semana conferida','Cliente contatado 48 h antes','Alçada e proposta inicial por escrito','Resultado lançado no mesmo dia']],
  'POP-04':['Controle de cumprimento do acordo',['Parcelas e vencimentos lançados','Conferência do depósito na data','Aviso ao cliente sobre cada pagamento','Petição de descumprimento se houver atraso']],
  'POP-05':['Atendimento ao cliente',['Identidade conferida antes de informar andamento','Alerta do golpe do falso advogado enviado','Resposta no prazo da frente','Dúvida técnica encaminhada ao advogado']],
  'POP-06':['Triagem de novo cliente',['Formulário de primeiro atendimento','Checagem de conflito de interesse','Encaminhado ao advogado da área em 1 dia útil','Proposta e contrato de honorários','Procuração e cadastro']]
};
const LEAD_STATUS=['Novo','Em triagem','Com advogado','Proposta enviada','Contratou','Não contratou'];
const LEAD_ORIGEM=['Procurou pelo WhatsApp','Procurou por telefone','Veio ao escritório','Indicação de cliente','Instagram / site','Ex-cliente que voltou','Cliente da carteira (novo caso)','Parceiro / outro advogado'];
const AREAS=['Defesa em execução bancária','Revisional / consignado','Busca e apreensão','PASEP / Plano Collor','Servidor público','Trabalhista','Família','Previdenciário','Criminal','Cível em geral'];

/* ===================== estado ===================== */
const S={db:null,user:null,uid:null,local:false,canWrite:true,isEditor:false,
  equipe:[],processos:[],log:[],logInfo:null,vinculos:{},contatos:[],casos:[],tarefas:[],leads:[],radar:[],pauta:[],clientes:[],msgs:[],atividades:[],conferencia:[],nichos:[],plano:[],isOwner:false,sample:null,config:{faixa1:85,faixa2:65,teto:0},
  me:null,loaded:{},route:'hoje',f:{buscaP:'',atvM:'',atvCol:'',per:'30',membro:'',cp:'',resp:'',status:'abertas',capt:'nichos',ac:'funil',busca:'',at:'abertos',dst:'abertas',dia:'',diaM:''}};
const COLS=['equipe','processos','vinculos','contatos','casos','tarefas','leads','radar','pauta','clientes','msgs','atividades','conferencia','nichos','plano'];

/* camada de dados: banco compartilhado do artifact, ou memória local quando aberto fora do claude.ai */
const API={
  sub(col,cb){
    if(S.local){LOCAL.subs[col]=cb;cb(LOCAL.data[col]||[]);return}
    S.db.collection(col).onSnapshot(s=>{cb(s.docs.map(d=>({id:d.id,...d.data()})));S.loaded[col]=true;},e=>{S.loaded[col]=true;console.warn(col,e);bannerErr(e)});
  },
  subDoc(path,cb){
    if(S.local){cb(LOCAL.cfg);return}
    S.db.doc(path).onSnapshot(s=>cb(s.exists?s.data():null),e=>console.warn(path,e));
  },
  async set(col,id,data){
    if(S.local){const a=LOCAL.data[col]=(LOCAL.data[col]||[]).filter(x=>x.id!==id);a.push({id,...data});LOCAL.subs[col]&&LOCAL.subs[col]([...a]);return}
    return S.db.collection(col).doc(id).set(data);
  },
  async upd(col,id,data){
    if(S.local){const a=LOCAL.data[col]||[];const i=a.findIndex(x=>x.id===id);if(i>=0)a[i]={...a[i],...data};LOCAL.subs[col]&&LOCAL.subs[col]([...a]);return}
    return S.db.collection(col).doc(id).update(data);
  },
  async del(col,id){
    if(S.local){LOCAL.data[col]=(LOCAL.data[col]||[]).filter(x=>x.id!==id);LOCAL.subs[col]&&LOCAL.subs[col]([...LOCAL.data[col]]);return}
    return S.db.collection(col).doc(id).delete();
  },
  async setCfg(data){
    if(S.local){LOCAL.cfg={...LOCAL.cfg,...data};S.config=LOCAL.cfg;render();return}
    return S.db.doc('config/geral').set({...S.config,...data});
  }
};

function alcada(c){
  const ref=+c.valorReferencia, v=valorDisc(c); if(!ref||!v)return null;
  const f1=+S.config.faixa1||85, f2=+S.config.faixa2||65, teto=+S.config.teto||0;
  let nivel,leitura;
  if(c.polo==='devedor'){const exc=(v/ref-1)*100;leitura=(exc>=0?'+':'')+exc.toFixed(0)+'% sobre a referência';
    nivel=exc<=100-f1?'integrante':exc<=100-f2?'coordenador':'diretoria';}
  else{const p=v/ref*100;leitura=p.toFixed(0)+'% da referência';nivel=p>=f1?'integrante':p>=f2?'coordenador':'diretoria';}
  if(teto&&v>teto)nivel='diretoria';
  const ap=c.aprovacao; const aprovado=nivel==='integrante'||(ap&&ap.status==='aprovada'&&+ap.valor===v&&RANK[ap.nivel]>=RANK[nivel]);
  return {nivel,leitura,aprovado,v,ref};

function metricas(mid,per){
  const fc=x=>!mid||x===mid;
  const cts=S.contatos.filter(c=>fc(c.membroId)&&noPer(c.data,per));
  const ef=cts.filter(c=>!NAO_EFETIVO.includes(c.resultado));
  const prop=cts.filter(c=>c.resultado==='Proposta enviada');
  const fech=S.casos.filter(c=>fc(c.responsavel)&&noPer(c.fechadoEm,per));
  const rec=S.casos.filter(c=>fc(c.responsavel)&&noPer(c.recusadoEm,per));
  const valor=fech.reduce((s,c)=>s+(+c.valorAcordado||0),0);
  const tempos=fech.map(c=>dias(c.primeiroContatoEm||c.criadoEm,c.fechadoEm)).filter(x=>x>=0);
  const tf=S.tarefas.filter(t=>fc(t.responsavel));
  const concl=tf.filter(t=>t.status==='concluida'&&noPer(t.concluidaEm,per));
  const noPrazo=concl.filter(t=>!t.prazo||String(t.concluidaEm).slice(0,10)<=t.prazo);
  const atras=tf.filter(t=>t.status!=='concluida'&&t.prazo&&t.prazo<hoje());
  const abertos=S.casos.filter(c=>fc(c.responsavel)&&casoAberto(c));
  const parados=abertos.filter(c=>parado(c)>7);
  const ld=S.leads.filter(l=>fc(l.responsavel)&&noPer(l.criadoEm,per));
  const conv=S.leads.filter(l=>fc(l.responsavel)&&noPer(l.contratouEm,per));
  return {cts:cts.length,ef:ef.length,efPct:cts.length?ef.length/cts.length:NaN,prop:prop.length,fech:fech.length,rec:rec.length,
    taxa:(fech.length+rec.length)?fech.length/(fech.length+rec.length):NaN,valor,tempo:tempos.length?tempos.reduce((a,b)=>a+b,0)/tempos.length:NaN,
    concl:concl.length,noPrazo:concl.length?noPrazo.length/concl.length:NaN,atras:atras.length,abertos:abertos.length,parados:parados.length,
    leads:ld.length,conv:conv.length,diasCts:cts.map(c=>c.data)};
}

function campo(f,v){
  const id='f_'+f.k, req=f.req?' required':'', full=f.full?' full':'';
  if(f.type==='sec')return `<div class="sec">${esc(f.label)}</div>`;
  if(f.type==='html')return `<div class="calc" id="${id}"></div>`;
  if(f.type==='check')return `<label class="ck${full}"><input type="checkbox" id="${id}" ${v?'checked':''}> ${esc(f.label)}</label>`;
  let inp;
  if(f.type==='select'){const ops=(typeof f.options==='function'?f.options():f.options).map(o=>Array.isArray(o)?o:[o,o]);
    inp=`<select id="${id}"${req}>${f.blank!==false?`<option value="">${esc(f.blank||'Selecione')}</option>`:''}${ops.map(([a,b])=>`<option value="${esc(a)}" ${String(v??'')===String(a)?'selected':''}>${esc(b)}</option>`).join('')}</select>`}
  else if(f.type==='textarea')inp=`<textarea id="${id}"${req}>${esc(v??'')}</textarea>`;
  else inp=`<input id="${id}" type="${f.type==='money'?'number':f.type||'text'}" ${f.type==='money'?'step="0.01" min="0"':''} value="${esc(v??'')}"${req} ${f.ph?`placeholder="${esc(f.ph)}"`:''}>`;
  return `<label class="${full.trim()}" for="${id}">${esc(f.label)}${inp}</label>`;
}

function abrirForm({titulo,fields,values={},botao='Salvar',onSubmit,onChange,extra='',apagar}){
  abrirModal(`<header><h2>${esc(titulo)}</h2><button class="btn s" id="xFechar" aria-label="Fechar">Fechar</button></header>
    <form class="form" id="frm">${fields.map(f=>campo(f,values[f.k])).join('')}</form>${extra}
    <div class="row" style="justify-content:space-between">${apagar?'<button class="btn d" id="xApagar" type="button">Apagar</button>':'<span></span>'}
    <div class="row"><button class="btn" id="xCanc" type="button">Cancelar</button><button class="btn p" id="xOk" type="button">${esc(botao)}</button></div></div>`,m=>{
    const frm=m.querySelector('#frm');

    if(apagar)m.querySelector('#xApagar').onclick=async()=>{const b=m.querySelector('#xApagar');if(b.dataset.c){await apagar();fecharModal()}else{b.dataset.c=1;b.textContent='Clique de novo para apagar'}};
    const ch=()=>onChange&&onChange(lerForm(fields,frm),m);frm.addEventListener('input',ch);frm.addEventListener('change',ch);ch();

function statsTarefas(mid,per){
  const ts=S.tarefas.filter(t=>t.responsavel===mid),now=Date.now();
  const ab=ts.filter(t=>stTarefa(t)!=='concluida');
  const conc=ts.filter(t=>stTarefa(t)==='concluida'&&noPer(t.concluidaEm,per));
  const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:NaN;
  const ultimo=Math.max(0,...ts.map(t=>t.ultimaAtualizacao||t.iniciadaTs||0));
  return {abertas:ab.filter(t=>stTarefa(t)==='aberta').length,andamento:ab.filter(t=>stTarefa(t)==='andamento').length,
    atrasadas:ab.filter(t=>prazoTs(t)&&prazoTs(t)<now).length,concl:conc.length,
    noPrazo:conc.length?conc.filter(t=>!prazoTs(t)||t.concluidaTs<=prazoTs(t)).length/conc.length:NaN,
    tIni:avg(ts.filter(t=>t.iniciadaTs&&t.criadoTs&&noPer(iso(t.iniciadaTs),per)).map(t=>t.iniciadaTs-t.criadoTs)),
    tExec:avg(conc.filter(t=>t.concluidaTs).map(t=>t.concluidaTs-(t.iniciadaTs||t.criadoTs||t.concluidaTs))),ultimo};
}

async function decidir(id,ok){

  if(ok)return go();
  abrirForm({titulo:'Recusar pedido',botao:'Recusar',fields:[{k:'motivo',label:'Motivo e orientação ao negociador',type:'textarea',full:true,req:true}],onSubmit:v=>go(v.motivo)});

function chartDias(per,mid){
  const [a,b]=per;const n=Math.min(dias(a,b)+1,90);const ini=addDias(b,-(n-1));
  const cnt={};S.contatos.forEach(c=>{if((!mid||c.membroId===mid)&&noPer(c.data,[ini,b]))cnt[c.data]=(cnt[c.data]||0)+1});
  const vals=[...Array(n)].map((_,i)=>{const d=addDias(ini,i);return [d,cnt[d]||0]});
  const max=Math.max(4,...vals.map(v=>v[1]));const top=Math.ceil(max/4)*4;
  const W=680,H=150,L=28,B=20,bw=(W-L)/n;
  let g='';for(let i=0;i<=4;i++){const y=H-B-(H-B-8)*i/4;g+=`<line x1="${L}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${L-4}" y="${y+3}" text-anchor="end">${top*i/4}</text>`}
  const bars=vals.map(([d,v],i)=>{const h=(H-B-8)*v/top;const x=L+i*bw+1;const wk=new Date(d+'T12:00').getDay();
    return `<rect x="${x}" y="${H-B-h}" width="${Math.max(1,bw-2)}" height="${h}" rx="1.5" fill="${i===n-1?'var(--accent)':wk===0||wk===6?'var(--line)':'color-mix(in srgb,var(--accent) 55%,transparent)'}"><title>${fd(d)}: ${v} contatos</title></rect>`}).join('');
  const step=Math.ceil(n/8);const lbl=vals.map(([d],i)=>(i%step===0&&n-1-i>=step/2)||i===n-1?`<text x="${L+i*bw+bw/2}" y="${H-5}" text-anchor="middle">${d.slice(8)}/${d.slice(5,7)}</text>`:'').join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Contatos por dia">${g}${bars}${lbl}</svg>`;
}

function mdLite(t){
  return esc(t).split('\n').map(l=>{
    l=l.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
    if(/^#{1,3}\s/.test(l))return `<h3>${l.replace(/^#{1,3}\s/,'')}</h3>`;
    if(/^\s*[-•]\s/.test(l))return `<li>${l.replace(/^\s*[-•]\s/,'')}</li>`;
    if(/^\s*\d+[.)]\s/.test(l))return `<li>${l.replace(/^\s*\d+[.)]\s/,'')}</li>`;
    return l.trim()?`<p>${l}</p>`:'';}).join('').replace(/(<li>.*?<\/li>)+/g,m=>`<ul>${m}</ul>`);
}

function fichaAtendimento(l={}){

      <label class="full" for="aArea">Assunto<select id="aArea"><option value="">Selecione o assunto</option>${AREAS.map(o=>`<option ${st.area===o?'selected':''}>${o}</option>`).join('')}</select></label>
      <label class="full" for="aRel">Relato do caso, nas palavras do cliente<textarea id="aRel" style="min-height:130px" placeholder="O que aconteceu, quando, com quem, o que a pessoa quer.">${esc(st.relato||'')}</textarea></label>
    </div>
    <div id="aPerg">${pergHtml()}</div>

      <label class="ck full"><input type="checkbox" id="aConf" ${st.conflito?'checked':''}> Conflito de interesse checado</label>
    </div>

    <div class="guia"><div class="row" style="justify-content:space-between"><h3>Possíveis estratégias</h3><button class="btn p s" id="aIA" type="button">${st.analise?'Analisar de novo':'Analisar o caso'}</button></div>
      <div id="aOut" class="analise">${st.analise?mdLite(st.analise):'<p class="small muted">Preencha o relato e as respostas e clique em Analisar. O app sugere teses, fundamentos, riscos, perguntas que faltam e documentos. É uma análise preliminar: quem decide a estratégia é o advogado da área.</p>'}</div></div>

  <div class="row"><button class="btn" id="aCan" type="button">Cancelar</button><button class="btn p" id="aOk" type="button">Salvar ficha</button></div></div>`,m=>{

const COL_NOME={clientes:'cliente',processos:'processo',tarefas:'tarefa',contatos:'contato',casos:'acordo',leads:'atendimento',pauta:'pauta de conteúdo',radar:'radar da carteira',msgs:'mensagem',atividades:'atividade do dia',equipe:'pessoa da equipe',config:'alçadas',vinculos:'vínculo de login',nichos:'nicho de captação',plano:'plano de captação',conferencia:'conferência'};
function pessoaLog(r){const v=r.uid&&S.vinculos[r.uid];return v&&membro(v.membroId)?nomeM(v.membroId):(r.email||'Desconhecido')}
function membroLog(r){const v=r.uid&&S.vinculos[r.uid];return v?v.membroId:''}
function descLog(r){
  if(r.acao==='acesso')return 'Entrou no app';
  if(r.acao==='saida')return 'Saiu do app';
  const o=COL_NOME[r.col]||r.col||'registro',rot=r.rotulo?': '+r.rotulo:'',dt=r.detalhe||{},cs=r.campos||[];
  if(r.acao==='insert')return (r.col==='contatos'?'Registrou contato':r.col==='leads'?'Abriu ficha de atendimento':r.col==='atividades'?'Lançou atividade do dia':r.col==='tarefas'?'Criou tarefa':'Cadastrou '+o)+rot;
  if(r.acao==='delete')return 'Apagou '+o+rot;
  if(r.col==='tarefas'&&cs.includes('status')){const m={andamento:'Iniciou tarefa',concluida:'Concluiu tarefa',aberta:'Reabriu tarefa'}[dt.status];if(m)return m+rot}
  if(r.col==='tarefas'&&cs.includes('atualizacoes'))return 'Registrou andamento na tarefa'+rot;
  if(r.col==='casos'&&cs.includes('etapa')){const e=ETAPAS[ETAPA_IDX[dt.etapa]];return 'Moveu acordo'+rot+(e?' para '+e[1]:'')}
  if(r.col==='contatos'&&cs.includes('retornoFeito'))return 'Fez retorno combinado'+rot;
  return 'Alterou '+o+rot+(cs.length?' ('+cs.filter(c=>!['atualizadoEm'].includes(c)).slice(0,4).join(', ')+')':'');
}
async function carregarLog(force){
  if(!SB||!isGestor())return;const per=periodo(),chave=per.join('|');
  if(!force&&S.logInfo&&S.logInfo.chave===chave&&Date.now()-S.logInfo.em<60000)return;
  S.logInfo={chave,em:Date.now(),carregando:true};
  const {data,error}=await SB.from('acordos_log').select('*').gte('ts',per[0]+'T00:00:00-03:00').lte('ts',per[1]+'T23:59:59-03:00').order('ts',{ascending:false}).limit(5000);
  S.logInfo={chave,em:Date.now(),erro:error?error.message:null};S.log=data||[];render();
}
function resumoLog(regs){
  const por={};
  for(const r of regs){const k=membroLog(r)||('e:'+(r.email||'?'));const o=por[k]||(por[k]={nome:pessoaLog(r),acessos:0,ult:null,cli:0,proc:0,tc:0,tf:0,ct:0,at:0,ac:0,total:0});
    if(r.acao==='acesso'){o.acessos++;if(!o.ult||r.ts>o.ult)o.ult=r.ts;continue}
    if(r.acao==='saida')continue;o.total++;
    if(r.acao==='insert'){if(r.col==='clientes')o.cli++;if(r.col==='processos')o.proc++;if(r.col==='tarefas')o.tc++;if(r.col==='contatos')o.ct++;if(r.col==='leads')o.at++;if(r.col==='casos')o.ac++}
    if(r.acao==='update'&&r.col==='tarefas'&&(r.campos||[]).includes('status')&&(r.detalhe||{}).status==='concluida')o.tf++;
    if(r.acao==='update'&&r.col==='casos'&&(r.campos||[]).includes('etapa'))o.ac++;}
  return Object.values(por).sort((a,b)=>b.total-a.total);
}

function tabelaResumoLog(regs){const rs=resumoLog(regs);

  return rs.length?`<div class="tw"><table><tr><th>Pessoa</th><th class="n">Acessos</th><th>Último acesso</th><th class="n">Clientes cadastrados</th><th class="n">Processos cadastrados</th><th class="n">Atendimentos</th><th class="n">Contatos</th><th class="n">Tarefas criadas</th><th class="n">Tarefas concluídas</th><th class="n">Acordos (novos/movidos)</th><th class="n">Total de ações</th></tr>

const RX_WA=[/^\[?(\d{1,2})\/(\d{1,2})\/(\d{2,4}),? (\d{1,2}):(\d{2})(?::\d{2})?\]? (?:- )?([^:]{1,60}): /];

function parseCsv(t){const sep=(t.split('\n')[0].match(/;/g)||[]).length>(t.split('\n')[0].match(/,/g)||[]).length?';':',';
  return t.split(/\r?\n/).filter(l=>l.trim()).map(l=>{const o=[];let c='',q=false;for(const ch of l){if(ch==='"'){q=!q}else if(ch===sep&&!q){o.push(c);c=''}else c+=ch}o.push(c);return o.map(x=>x.trim())})}
function dataBr(s){s=String(s||'');let m=s.match(/(\d{4})-(\d{2})-(\d{2})/);if(m)return `${m[1]}-${m[2]}-${m[3]}`;m=s.match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);if(m){let y=+m[3];if(y<100)y+=2000;return `${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`}return null}
function segs(s){s=String(s||'').trim();if(/^\d+$/.test(s))return +s;const p=s.split(':').map(Number);if(p.length===3)return p[0]*3600+p[1]*60+p[2];if(p.length===2)return p[0]*60+p[1];return 0}
function importarLig(){
  abrirModal(`<header><h2>Importar registro de ligações</h2><button class="btn s" id="iX">Fechar</button></header>
  <div class="form"><label for="iM">De quem é a linha ou ramal<select id="iM">${opM().map(([a,b])=>`<option value="${a}">${esc(b)}</option>`).join('')}</select></label>
  <label for="iF">Arquivo CSV<input id="iF" type="file" accept=".csv,text/csv"></label>
  <label for="iD">Coluna da data<select id="iD"></select></label><label for="iT">Coluna da duração<select id="iT"></select></label></div>
  <p class="small muted" id="iInfo"></p><div class="row" style="justify-content:flex-end"><button class="btn p" id="iOk" disabled>Importar contagens</button></div>`,m=>{
    const g=x=>m.querySelector(x);let rows=[],nome='';g('#iX').onclick=fecharModal;
    g('#iF').onchange=async e=>{const f=e.target.files[0];if(!f)return;nome=f.name;rows=parseCsv(await f.text());const h=rows[0]||[];
      const op=h.map((x,i)=>`<option value="${i}">${esc(x||'Coluna '+(i+1))}</option>`).join('');g('#iD').innerHTML=op;g('#iT').innerHTML='<option value="">Sem duração</option>'+op;
      const di=h.findIndex(x=>/data|date|in[ií]cio/i.test(x)),ti=h.findIndex(x=>/dura|tempo|seg/i.test(x));if(di>=0)g('#iD').value=di;if(ti>=0)g('#iT').value=ti;
      g('#iInfo').textContent=`${rows.length-1} linhas no arquivo. Confira as colunas.`;g('#iOk').disabled=false};
    g('#iOk').onclick=async()=>{const mid=g('#iM').value,di=+g('#iD').value,ti=g('#iT').value;const por={},key='lig_'+nome.toLowerCase().replace(/[^a-z0-9]+/g,'-').slice(0,60);let ok=0;
      rows.slice(1).forEach(r=>{const d=dataBr(r[di]);if(!d)return;ok++;por[d]=por[d]||{};por[d][key]=por[d][key]||{nome,qtd:0,seg:0};por[d][key].qtd++;if(ti!=='')por[d][key].seg+=segs(r[+ti])});
      if(!ok){toast('Não reconheci datas nessa coluna.');return}await gravarConf(mid,por,'lig');fecharModal()};
  });
}
async function gravarConf(mid,por,campo){
  const dias=Object.keys(por);let n=0;
  for(const d of dias){const id=`${mid}_${d}`,cur=S.conferencia.find(x=>x.id===id)||{};
    const doc={membroId:mid,data:d,wa:cur.wa||{},lig:cur.lig||{},importadoTs:Date.now()};doc[campo]={...doc[campo],...por[d]};
    if(await salvar(()=>API.set('conferencia',id,doc)))n++;await new Promise(r=>setTimeout(r,120))}
  toast(`${n} dia(s) importado(s)`);
}

  const id=e.target.id;
  if(id==='fResp')S.f.resp=e.target.value;else if(id==='fCp')S.f.cp=e.target.value;else if(id==='fStatus')S.f.status=e.target.value;
  else if(id==='fPer')S.f.per=e.target.value;else if(id==='fDia')S.f.dia=e.target.value;else if(id==='fDiaM')S.f.diaM=e.target.value;else if(id==='fDst')S.f.dst=e.target.value;else if(id==='fBusca')S.f.busca=e.target.value;else if(id==='fBuscaP')S.f.buscaP=e.target.value;else if(id==='fAtvM')S.f.atvM=e.target.value;else if(id==='fAtvC')S.f.atvCol=e.target.value;else if(id==='fMembro')S.f.membro=e.target.value;else return;
  e.target.blur();render();
});

/* ===================== inicialização ===================== */
function ligar(){
  COLS.forEach(col=>API.sub(col,docs=>{
    if(col==='vinculos'){S.vinculos=Object.fromEntries(docs.map(d=>[d.id,d]));if(S.uid&&S.vinculos[S.uid]&&!S.me)S.me=S.vinculos[S.uid].membroId}
    else S[col]=docs;
    if(S.me&&!membro(S.me)&&S.equipe.length&&col==='equipe')S.me=null;
    render()}));
  API.subDoc('config/geral',d=>{S.config={faixa1:85,faixa2:65,teto:0,...(d||{})};render()});
}
/* ===================== banco (Supabase) com a mesma interface usada pelo app ===================== */
function criarDB(sb){
  const T='acordos_docs';
  const cache={};          // col -> Map(id -> data)
  const ouv={};            // col -> [cb]
  const ouvDoc={};         // 'col/id' -> [cb]
  const pronto={};
  const lista=col=>[...(cache[col]||new Map()).entries()].map(([id,d])=>({id,data:()=>d,exists:true}));
  const avisar=col=>{
    const docs=lista(col);(ouv[col]||[]).forEach(f=>f({docs}));
    for(const k in ouvDoc){if(k.startsWith(col+'/')){const id=k.slice(col.length+1);const d=cache[col]&&cache[col].get(id);ouvDoc[k].forEach(f=>f({exists:!!d,data:()=>d}))}}
  };
  async function carregar(col){
    if(pronto[col])return pronto[col];
    pronto[col]=(async()=>{
      const m=new Map();let de=0;
      while(true){const {data,error}=await sb.from(T).select('id,data').eq('col',col).range(de,de+999);if(error)throw error;data.forEach(r=>m.set(r.id,r.data||{}));if(data.length<1000)break;de+=1000}
      cache[col]=m;
    })();
    return pronto[col];
  }
  sb.channel('acordos-docs').on('postgres_changes',{event:'*',schema:'public',table:T},p=>{
    const r=p.eventType==='DELETE'?p.old:p.new;if(!r||!r.col)return;
    const m=cache[r.col]||(cache[r.col]=new Map());
    if(p.eventType==='DELETE')m.delete(r.id);else m.set(r.id,r.data||{});
    avisar(r.col);
  }).subscribe();
  const erro=e=>{const x=new Error(e.message||'erro');x.code=(e.code==='42501'||/row-level security/i.test(e.message||''))?'invalid_argument':e.code;return x};
  const ref=(col,id)=>({
    async set(data){const {error}=await sb.from(T).upsert({col,id,data,updated_at:new Date().toISOString()});if(error)throw erro(error);(cache[col]||(cache[col]=new Map())).set(id,data);avisar(col)},
    async update(data){const atual=(cache[col]&&cache[col].get(id))||{};const novo={...atual,...data};const {error}=await sb.from(T).update({data:novo,updated_at:new Date().toISOString()}).eq('col',col).eq('id',id);if(error)throw erro(error);(cache[col]||(cache[col]=new Map())).set(id,novo);avisar(col)},
    async delete(){const {error}=await sb.from(T).delete().eq('col',col).eq('id',id);if(error)throw erro(error);cache[col]&&cache[col].delete(id);avisar(col)},
    onSnapshot(cb,err){const k=col+'/'+id;(ouvDoc[k]||(ouvDoc[k]=[])).push(cb);carregar(col).then(()=>{const d=cache[col].get(id);cb({exists:!!d,data:()=>d})}).catch(e=>err&&err(erro(e)))}
  });
  return {
    collection(col){return {doc:id=>ref(col,id),onSnapshot(cb,err){(ouv[col]||(ouv[col]=[])).push(cb);carregar(col).then(()=>cb({docs:lista(col)})).catch(e=>err&&err(erro(e)))}}},
    doc(path){const [c,id]=path.split('/');return ref(c,id)}
  };
}

/* ===================== entrada (login, convite e nova senha) ===================== */
const LINK_TIPO=(/type=(invite|recovery|signup|magiclink)/.exec(location.hash)||[])[1]||null;
let SB=null;
function telaAuth(modo,msg,cls){
  const A=$('#auth');
  const cab='<h1>Setor de Acordos</h1><p>D\'Freire Advocacia</p>';
  if(modo==='login')A.innerHTML=`<div class="auth"><form class="box" id="fLogin">${cab}
    <label>E-mail<input id="lEmail" type="email" autocomplete="username" required></label>
    <label>Senha<input id="lSenha" type="password" autocomplete="current-password" required></label>
    <button class="btn p" type="submit">Entrar</button>
    <a id="lEsq">Esqueci minha senha</a>
    <div class="msg ${cls||''}" id="lMsg">${esc(msg||'')}</div></form></div>`;
  if(modo==='senha')A.innerHTML=`<div class="auth"><form class="box" id="fSenha">${cab}
    <p>${LINK_TIPO==='invite'?'Bem-vindo! Crie sua senha para acessar o app.':'Defina sua nova senha.'}</p>
    <label>Nova senha (mínimo 8 caracteres)<input id="sN1" type="password" autocomplete="new-password" minlength="8" required></label>
    <label>Repita a senha<input id="sN2" type="password" autocomplete="new-password" minlength="8" required></label>
    <button class="btn p" type="submit">Salvar senha e entrar</button>
    <div class="msg ${cls||''}" id="lMsg">${esc(msg||'')}</div></form></div>`;
  if(modo==='login'){
    $('#fLogin').onsubmit=async e=>{e.preventDefault();$('#lMsg').textContent='Entrando…';$('#lMsg').className='msg';
      const {error}=await SB.auth.signInWithPassword({email:$('#lEmail').value.trim(),password:$('#lSenha').value});
      if(error){telaAuth('login','E-mail ou senha incorretos.','err');return}
      iniciarApp()};
    $('#lEsq').onclick=async()=>{const em=$('#lEmail').value.trim();if(!em){$('#lMsg').textContent='Digite seu e-mail acima e clique de novo.';$('#lMsg').className='msg err';return}
      const {error}=await SB.auth.resetPasswordForEmail(em,{redirectTo:location.origin+location.pathname});
      $('#lMsg').textContent=error?'Não foi possível enviar agora. Tente de novo.':'Se o e-mail estiver cadastrado, você receberá um link para criar nova senha.';$('#lMsg').className='msg '+(error?'err':'ok')};
  }
  if(modo==='senha'){
    $('#fSenha').onsubmit=async e=>{e.preventDefault();const a=$('#sN1').value,b=$('#sN2').value;
      if(a!==b){telaAuth('senha','As senhas não conferem.','err');return}
      const {error}=await SB.auth.updateUser({password:a});
      if(error){telaAuth('senha','Não foi possível salvar: '+error.message,'err');return}
      history.replaceState(null,'',location.pathname);iniciarApp()};
  }
}
async function sair(){try{await SB.rpc('acordos_registrar',{acao:'saida',rotulo:null});sessionStorage.removeItem('acesso_reg')}catch(e){}try{await SB.auth.signOut()}catch(e){}try{localStorage.removeItem('setor_me')}catch(e){}location.href=location.pathname}
let INICIADO=false;
async function iniciarApp(){
  if(INICIADO)return;INICIADO=true;
  $('#auth').innerHTML='';
  const {data:{user}}=await SB.auth.getUser();
  if(!user){INICIADO=false;telaAuth('login');return}
  S.uid=user.id;S.email=user.email;
  try{const {data}=await SB.rpc('acordos_is_admin');S.isEditor=!!data;S.isOwner=!!data}catch(e){}
  S.db=criarDB(SB);S.sample=null;S.canWrite=true;
  try{if(!sessionStorage.getItem('acesso_reg')){await SB.rpc('acordos_registrar',{acao:'acesso',rotulo:navigator.userAgent.includes('Mobi')?'celular':'computador'});sessionStorage.setItem('acesso_reg','1')}}catch(e){}
  ligar();render();
}
(async function init(){
  S.route=rotaAtual();
  try{S.me=localStorage.getItem('setor_me')||null}catch(e){}
  const CFG=window.SETOR_CONFIG||{};
  if(!window.supabase||!CFG.url||!CFG.anonKey){$('#main').innerHTML='<div class="banner">Configuração do banco ausente (config.js).</div>';return}
  SB=window.supabase.createClient(CFG.url,CFG.anonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:'implicit'}});
  SB.auth.onAuthStateChange(ev=>{if(ev==='PASSWORD_RECOVERY')telaAuth('senha')});
  const {data:{session}}=await SB.auth.getSession();
  if(session&&(LINK_TIPO==='invite'||LINK_TIPO==='recovery')){telaAuth('senha');return}
  if(session){if(location.hash.includes('access_token'))history.replaceState(null,'',location.pathname);iniciarApp();return}
  telaAuth('login');
})();
</script>
